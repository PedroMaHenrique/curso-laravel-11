[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

; ==============================================================================
; Laravel Octane
; ==============================================================================
[program:octane]
command=/bin/bash -c "php artisan octane:start --server=${OCTANE_SERVER:-swoole} --host=0.0.0.0 --port=${OCTANE_PORT:-8000} --workers=1 --task-workers=0 --no-interaction"
directory=/var/www/html
user=sail
autostart=true
autorestart=unexpected
startsecs=10
startretries=30
stopsignal=QUIT
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/var/log/supervisor/octane.out.log
stderr_logfile=/var/log/supervisor/octane.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=10

; ==============================================================================
; Vite Dev Server (apenas modo local)
; ==============================================================================
[program:vite]
command=/bin/bash -c "fuser -k ${VITE_PORT:-5175}/tcp 2>/dev/null || true; if [ \"$APP_ENV\" = \"local\" ]; then npm run dev -- --host 0.0.0.0 --port ${VITE_PORT:-5175}; else echo 'Modo produção, Vite não será iniciado.'; fi"
directory=/var/www/html
user=sail
autostart=true
autorestart=true
startsecs=3
stdout_logfile=/var/log/supervisor/vite.out.log
stderr_logfile=/var/log/supervisor/vite.err.log
stdout_logfile_maxbytes=0
stderr_logfile_maxbytes=0
priority=20
